# Builds the Rust simulation core to WebAssembly, type-checks and bundles the client, runs the unit
# tests, then serves the bundle the way GitHub Pages does and plays it in headless Chromium
# (solo on WebGL2 and WebGPU, and a two-player party over real WebRTC). Pushes to main that pass
# everything are published to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Build, test and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test simulation core (Rust)
        run: cargo test --locked

      - name: Build Wasm, type-check and bundle
        run: npm run build

      - name: Test client (Wasm bindings, netcode, glTF loader)
        run: npx vitest run

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Play the built site in headless Chromium
        run: |
          node tools/serve-pages.mjs 4180 /grave-shift/ &
          sleep 1
          node tests/e2e/smoke.mjs http://localhost:4180/grave-shift/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e-results
          retention-days: 7

  # Pages has to publish what this workflow uploads, not the raw branch. Reports the current
  # setting and switches it to "GitHub Actions" when the token is allowed to.
  pages-setup:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Check and set the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          config=$(gh api "repos/$REPO/pages" 2>&1) || { echo "::warning::Could not read Pages settings: $config"; exit 0; }
          echo "$config" | jq '{build_type, source, html_url, status}'
          if [ "$(echo "$config" | jq -r .build_type)" = "workflow" ]; then
            echo "Pages already publishes from GitHub Actions."
          elif out=$(gh api -X PUT "repos/$REPO/pages" -f build_type=workflow 2>&1); then
            echo "Switched the Pages source to GitHub Actions."
            gh api "repos/$REPO/pages" | jq '{build_type, source}'
          else
            echo "::warning::Pages still deploys from a branch, and this token cannot change it ($out). Set Settings > Pages > Source to GitHub Actions."
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, e2e, pages-setup]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grave Shift</title>
<meta name="description" content="Round-based zombie survival in your browser. Co-op with up to 4 friends via invite link.">
<style>
  :root { --red: #d8261c; --ink: #e9e4da; --dim: #9a948a; --panel: rgba(10, 10, 12, 0.88); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050608; color: var(--ink); font: 15px/1.4 "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; border: 1px solid #5a1a14; background: #1c0f0d; color: var(--ink); padding: 10px 18px; letter-spacing: 0.08em; text-transform: uppercase; }
  button:hover, button:focus-visible { background: var(--red); border-color: var(--red); outline: none; }
  button.primary { background: var(--red); border-color: var(--red); }
  button.primary:hover { background: #f03a2e; }
  input { font: inherit; background: #111; color: var(--ink); border: 1px solid #333; padding: 9px 12px; }
  input:focus { outline: 1px solid var(--red); }

  .panel { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(40, 6, 4, 0.55), rgba(0, 0, 0, 0.92)); z-index: 10; padding: 16px; }
  .card { width: min(520px, 100%); background: var(--panel); border: 1px solid #2a2a2a; border-top: 3px solid var(--red); padding: 28px; }
  .card h1 { margin: 0; font: 900 52px/1 Impact, "Arial Narrow", sans-serif; letter-spacing: 0.06em; color: var(--red); text-shadow: 0 0 24px rgba(216, 38, 28, 0.5); }
  .card h2 { margin: 0 0 16px; font: 800 30px/1 Impact, sans-serif; letter-spacing: 0.08em; color: var(--red); }
  .sub { color: var(--dim); margin: 6px 0 22px; }
  .row { display: flex; gap: 8px; margin: 10px 0; }
  .row > input { flex: 1; min-width: 0; }
  label { display: block; color: var(--dim); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 14px; }
  .controls { margin-top: 22px; color: var(--dim); font-size: 13px; columns: 2; column-gap: 20px; }
  .controls b { color: var(--ink); font-weight: 600; }
  #menuMsg, #pauseMsg { min-height: 20px; color: #ff8a7a; margin-top: 10px; }
  #invited { color: #ffcf6b; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; margin: 14px 0; }
  td, th { padding: 6px 8px; text-align: right; border-bottom: 1px solid #222; }
  td:first-child, th:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #cross { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; background: rgba(255, 255, 255, 0.85); border-radius: 50%; box-shadow: 0 0 2px #000; }
  #hitm { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 700 28px sans-serif; color: #fff; opacity: 0; transition: opacity 0.15s; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(170, 0, 0, 0.85)); opacity: 0; }
  #downfx { position: absolute; inset: 0; backdrop-filter: grayscale(1) brightness(0.7); background: rgba(60, 0, 0, 0.25); }
  #banner { position: absolute; top: 18%; width: 100%; text-align: center; font: 900 72px/1 Impact, sans-serif; color: var(--red); letter-spacing: 0.08em; text-shadow: 0 0 30px rgba(216, 38, 28, 0.7); opacity: 0; transition: opacity 0.6s; }
  #prompt { position: absolute; top: 62%; width: 100%; text-align: center; font-size: 18px; text-shadow: 0 1px 3px #000, 0 0 8px #000; }
  #toast { position: absolute; top: 70%; width: 100%; text-align: center; color: #ffcf6b; font-size: 16px; text-shadow: 0 1px 3px #000; }
  #status { position: absolute; top: 40%; width: 100%; text-align: center; font: 700 26px Impact, sans-serif; letter-spacing: 0.06em; text-shadow: 0 2px 6px #000; }
  #revbar { position: absolute; top: 66%; left: 50%; width: 240px; height: 8px; margin-left: -120px; background: rgba(0, 0, 0, 0.6); border: 1px solid #555; }
  #revbar div { height: 100%; width: 0; background: #e8e8e8; }
  #bl { position: absolute; left: 28px; bottom: 22px; }
  #round { font: 900 96px/0.9 Impact, sans-serif; color: var(--red); text-shadow: 0 0 18px rgba(216, 38, 28, 0.6), 0 2px 0 #300; min-height: 86px; }
  #perks { display: flex; gap: 6px; margin-bottom: 10px; }
  #perks span { width: 34px; height: 34px; display: grid; place-items: center; font: 800 13px sans-serif; border: 2px solid rgba(255, 255, 255, 0.7); border-radius: 50%; color: #fff; text-shadow: 0 1px 2px #000; }
  #br { position: absolute; right: 28px; bottom: 22px; text-align: right; }
  #scores div { font: 700 20px Impact, sans-serif; letter-spacing: 0.04em; margin: 2px 0; text-shadow: 0 1px 3px #000; }
  #scores i { font-style: normal; font-size: 14px; color: var(--dim); margin-right: 8px; font-family: "Segoe UI", sans-serif; font-weight: 500; }
  #ammo { margin-top: 12px; }
  #wname { display: block; color: var(--dim); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
  #mag { font: 900 44px/1 Impact, sans-serif; }
  #res { font: 700 22px Impact, sans-serif; color: var(--dim); margin-left: 6px; }
  #pop { position: absolute; right: 28px; bottom: 150px; font: 700 18px Impact, sans-serif; color: #ffd84a; opacity: 0; transition: opacity 0.4s, transform 0.4s; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="vignette"></div>
  <div id="downfx" hidden></div>
  <div id="cross"></div>
  <div id="hitm">✕</div>
  <div id="banner"></div>
  <div id="status"></div>
  <div id="prompt"></div>
  <div id="revbar" hidden><div></div></div>
  <div id="toast"></div>
  <div id="pop"></div>
  <div id="bl"><div id="perks"></div><div id="round"></div></div>
  <div id="br"><div id="scores"></div><div id="ammo"><span id="wname"></span><b id="mag"></b><span id="res"></span></div></div>
</div>

<div id="menu" class="panel">
  <div class="card">
    <h1>GRAVE SHIFT</h1>
    <p class="sub">Round-based zombie survival. Solo or co-op with up to 4 friends.</p>
    <div id="invited" hidden></div>
    <label for="name">Your name</label>
    <div class="row"><input id="name" maxlength="16" placeholder="Survivor" autocomplete="nickname"></div>
    <div class="row"><button id="hostBtn" class="primary" style="flex:1">Host game</button></div>
    <label for="code">Join a friend</label>
    <div class="row"><input id="code" maxlength="5" placeholder="Room code" autocomplete="off"><button id="joinBtn">Join</button></div>
    <div id="menuMsg" role="status"></div>
    <div class="controls">
      <div><b>WASD</b> move</div><div><b>Shift</b> sprint</div><div><b>C</b> crouch / slide</div><div><b>Space</b> jump</div>
      <div><b>Mouse</b> shoot / aim</div><div><b>R</b> reload</div><div><b>1 2 / wheel</b> switch</div><div><b>V</b> melee</div>
      <div><b>F</b> buy / revive</div><div><b>Esc</b> pause / invite</div>
    </div>
  </div>
</div>

<div id="pause" class="panel" hidden>
  <div class="card">
    <h2>PAUSED</h2>
    <div class="row"><button id="resumeBtn" class="primary" style="flex:1">Resume</button></div>
    <div id="inviteBox">
      <label for="invite">Invite friends: send them this link</label>
      <div class="row"><input id="invite" readonly><button id="copyBtn">Copy</button></div>
    </div>
    <label>Players</label>
    <div id="plist"></div>
    <div id="pauseMsg" role="status"></div>
    <div class="row"><button id="leaveBtn" style="flex:1">Leave game</button></div>
  </div>
</div>

<div id="over" class="panel" hidden>
  <div class="card">
    <h2>GAME OVER</h2>
    <p id="overText" class="sub"></p>
    <table><thead><tr><th>Player</th><th>Kills</th><th>Headshots</th><th>Downs</th><th>Points</th></tr></thead><tbody id="overTable"></tbody></table>
    <div class="row"><button id="againBtn" class="primary" style="flex:1">Play again</button><button id="menuBtn" style="flex:1">Main menu</button></div>
  </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
